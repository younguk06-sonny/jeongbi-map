# 분양시장 레이더(New-Build_Rader)가 아침에 모은 자료를 받아 앱 자료를 만들고 GitHub Pages로 배포합니다.
# 따로 넣을 키(시크릿)는 없습니다.
name: 자료 만들기 및 배포

on:
  schedule:
    - cron: '7 23 * * *'   # 매일 08:07 (한국시간) — 레이더 수집(07:17) 끝난 뒤
  workflow_dispatch:       # Actions 탭에서 'Run workflow'로 바로 실행
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 분양시장 레이더 자료 받기
        uses: actions/checkout@v4
        with:
          repository: younguk06-sonny/New-Build_Rader
          path: _src
          sparse-checkout: |
            lib
            cache/rt
            public/data

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 앱 자료 만들기
        run: SRC=_src node scripts/build-data.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # 업로드가 완전히 끝난 뒤 별도 단계에서 배포 (한 단계에서 하면 가끔 '자료를 못 찾음' 오류)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
