<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>정비맵 - 사업장 주변 시세·청약</title>
<meta name="description" content="정비사업장을 지도에서 고르면 주변 아파트 실거래 시세·평당가, 청약 일정, 공급 예정 단지를 한 번에 봅니다.">
<meta name="theme-color" content="#f3f5f8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="정비맵">
<link rel="stylesheet" href="style.css?v=6">
</head>
<body>

<!-- 지도 -->
<section class="view on" id="v-map">
  <div id="map"><div class="mapmsg" id="mapMsg">지도를 불러오는 중…</div></div>
  <div class="top">
    <div class="bar">
      <button class="search" id="btnRegion" title="지역 선택·검색">
        <img src="icons/icon-192.png" alt="">
        <span class="where"><b id="where">지역 선택</b><small>시도·시군구·구역·단지 검색</small></span>
        <i>🔍</i>
      </button>
      <button class="ibtn" id="btnSet" title="설정">⚙️</button>
    </div>
    <div class="ftabs" id="ftabs">
      <button data-p="sites" class="ft-site"><span>🏗️ 당사 사업장</span><em id="siteCnt"></em><i>▾</i></button>
      <button data-p="zones"><span>🗂️ 정비구역</span><em id="zoneCnt"></em><i>▾</i></button>
    </div>
    <div class="fpanel" id="fpanel">
      <div class="fp-sites" id="sitePanel"></div>
      <div class="zfilter" id="zfilter"></div>
    </div>
    <div class="zhint" id="zhint">지도를 확대하면 정비구역이 보여요</div>
  </div>
  <div class="fixbar" id="fixBar"><span class="grow">지도를 눌러 사업장 위치를 옮기세요</span><button class="btn sm" id="fixDone">완료</button></div>
  <div class="fixbar drawbar" id="drawBar"><span class="grow" id="drawInfo"></span>
    <button class="btn sm" data-d="undo">↩︎</button><button class="btn sm" data-d="clear">지우기</button><button class="btn sm" data-d="cancel">취소</button><button class="btn sm" data-d="done">완료</button></div>
  <button class="study-fab" id="btnStudy" title="부동산 스터디">📊<span>스터디</span></button>
  <div class="fabs" id="fabs">
    <button class="ibtn" id="btnCad" title="지적편집도">🧱</button>
    <button class="ibtn" id="btnMe" title="내 위치">📍</button>
  </div>
  <div class="legend" id="legend">
    <span><i style="background:var(--new)"></i>5년 이내</span><span><i style="background:var(--mid)"></i>10년 이내</span><span><i style="background:var(--old)"></i>10년 초과</span><span><i style="background:var(--ch)"></i>청약</span>
  </div>
  <div class="sheet" id="sheet">
    <div class="handle" id="handle"><i></i></div>
    <div class="sh-head" id="shHead"></div>
    <div class="stabs" id="stabs">
      <button data-t="info" class="on">개요</button><button data-t="price">주변 시세</button><button data-t="supply">청약·공급</button>
    </div>
    <div class="sh-body" id="shBody"></div>
  </div>
</section>

<!-- 사업장 -->
<section class="view page" id="v-sites">
  <h1>당사 정비사업장</h1>
  <p class="lead">누르면 지도에서 주변 시세와 청약·공급을 볼 수 있어요.</p>
  <div class="seg" id="siteFilter" style="margin-bottom:12px"></div>
  <div id="siteList"></div>
</section>

<!-- 청약 -->
<section class="view page" id="v-cal">
  <h1>청약 일정</h1>
  <p class="lead">청약홈 입주자모집공고 기준 · 접수 예정·진행 중인 단지</p>
  <div class="seg" id="calFilter" style="margin-bottom:12px"></div>
  <div id="calList"><div class="empty">불러오는 중…</div></div>
</section>

<!-- 저장 -->
<section class="view page" id="v-saved">
  <h1>⭐ 저장</h1>
  <p class="lead">별표한 단지·청약을 모아 봐요. 이 기기에만 저장돼요.</p>
  <div id="savedList"></div>
</section>

<nav class="tabs" id="tabs">
  <button data-v="map" class="on"><span>🗺️</span>지도</button>
  <button data-v="sites"><span>🏗️</span>사업장</button>
  <button data-v="cal"><span>📅</span>청약</button>
  <button data-v="saved"><span>⭐</span>저장</button>
</nav>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="지역 선택">
  <div class="dr-head">
    <input class="input" id="q" type="search" placeholder="시도·시군구·동·구역·단지 검색" autocomplete="off" enterkeyhint="search">
    <button class="x" id="drClose" title="닫기">✕</button>
  </div>
  <div class="dr-crumb" id="crumb"></div>
  <div class="dr-body" id="drBody"></div>
  <div class="dr-study" id="drStudy"></div>
  <div class="dr-tool" id="drTool"></div>
  <div class="dr-foot" id="asOf"></div>
</aside>

<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script src="app.js?v=6"></script>
<script src="zones.js?v=6"></script>
<script src="region.js?v=6"></script>
<script src="study.js?v=6"></script>
</body>
</html>
